name: Build and test WSN v2

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod states the minimum language version the sources need.
          # Artifacts are built with a currently supported toolchain so they
          # pick up stdlib crypto/tls and net/http fixes.
          go-version: '1.25.x'
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l cmd internal)"
      - name: Cross-compile Windows client
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/wsn-client
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/wsnctl
      - name: Lint shell scripts
        # SC1091/SC2154: the WSN_* values come from /etc/wsn/*.env, which is
        # generated per client and does not exist at lint time.
        run: |
          shellcheck --severity=warning --exclude=SC1091,SC2154 \
            internal/provision/assets/*.sh deploy/server/*.sh
      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $found = Invoke-ScriptAnalyzer -Path internal/provision/assets -Recurse -Severity Error
          if ($found) {
              $found | Format-Table -AutoSize
              throw 'PSScriptAnalyzer reported errors'
          }

  artifacts:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod states the minimum language version the sources need.
          # Artifacts are built with a currently supported toolchain so they
          # pick up stdlib crypto/tls and net/http fixes.
          go-version: '1.25.x'
          cache: true
      - name: Build versioned binaries
        run: |
          mkdir dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/wsn-client-linux-amd64 ./cmd/wsn-client
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/wsnctl-linux-amd64 ./cmd/wsnctl
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/wsn-client-windows-amd64.exe ./cmd/wsn-client
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/wsnctl-windows-amd64.exe ./cmd/wsnctl
          sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/masteraler/wsn:${{ github.ref_name }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/masteraler/wsn
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
